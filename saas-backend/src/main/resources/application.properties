# For PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/masterdemo
spring.datasource.username=postgres
spring.datasource.password=${password_env}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
# spring.flyway.enabled=true
# spring.flyway.baseline-on-migrate=true

# Multi-tenancy configuration
app.multi-tenancy.enabled=true
app.multi-tenancy.default-tenant=default

# Security
spring.security.user.username=SuperAdmin
spring.security.user.email=superadmin@masterdemo.com
spring.security.user.password=Password_1
spring.security.user.role=SUPER_ADMIN

