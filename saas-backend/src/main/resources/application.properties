# ============================================================================
# JWT Authentication Configuration
# ============================================================================

# JWT secret key (should be at least 256 bits for HS256)
# In production, use environment variable: spring.security.jwt.secret=${JWT_SECRET_KEY}
spring.security.jwt.secret=mySecretKeyThatIsAtLeast256BitsLongForHS256SigningAlgorithmzzzzzzzzzzz
spring.security.jwt.expiration=900000
spring.security.jwt.refresh-token-expiration=604800000

